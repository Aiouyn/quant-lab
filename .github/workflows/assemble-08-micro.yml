name: assemble-08-micro
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-08-micro.yml'
      - 'desk/company/_rsi_chunks/08.m11'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/honest-rsi-scoreboard
      - name: Concat micro parts into 08.part
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('desk/company/_rsi_chunks')
          parts = [(root / f'08.m{i:02d}').read_bytes() for i in range(12)]
          data = b''.join(parts)
          assert len(data) == 20092, len(data)
          assert hashlib.sha256(data).hexdigest() == '2893bb7e5eefab30e7881b1329080c47f99b5db4a1603dc5fe9ae6dbfee02f51'
          (root / '08.part').write_bytes(data)
          print('WROTE', len(data), hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/company/_rsi_chunks/08.part
          git commit -m "fix: restore 08.part from verified micro parts" || echo "no change"
          git push origin HEAD:feat/honest-rsi-scoreboard
