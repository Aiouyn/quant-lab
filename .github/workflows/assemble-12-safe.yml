name: assemble-12-safe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-12-safe.yml'
      - 'desk/company/_rsi_chunks/12.s12'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/honest-rsi-scoreboard
      - name: Concat safe micros into 12.part
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('desk/company/_rsi_chunks')
          parts = [(root / f'12.s{i:02d}').read_bytes() for i in range(13)]
          data = b''.join(parts)
          assert len(data) == 20006, len(data)
          assert hashlib.sha256(data).hexdigest() == 'f5a5f0783e98545fb70c241a3782a2037d4de934eccd3a124e7cc100b7bebfd8'
          (root / '12.part').write_bytes(data)
          print('WROTE', len(data), hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/company/_rsi_chunks/12.part
          git commit -m "fix: restore 12.part from verified safe micros" || echo "no change"
          git push origin HEAD:feat/honest-rsi-scoreboard
