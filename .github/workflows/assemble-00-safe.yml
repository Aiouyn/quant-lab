name: assemble-00-safe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-00-safe.yml'
      - 'desk/company/_rsi_chunks/00.s12'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/honest-rsi-scoreboard
      - name: Concat safe micros into 00.part
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('desk/company/_rsi_chunks')
          parts = [(root / f'00.s{i:02d}').read_bytes() for i in range(13)]
          data = b''.join(parts)
          assert len(data) == 20015, len(data)
          assert hashlib.sha256(data).hexdigest() == 'aac7d9a8f3480ae9ce90eb2323aeb4e68e9efce016e63dc5ebf1d2cd3d99eede'
          assert data.startswith(b'"""Closed-loop')
          (root / '00.part').write_bytes(data)
          print('WROTE', len(data), hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/company/_rsi_chunks/00.part
          git commit -m "fix: restore 00.part from verified safe micros" || echo "no change"
          git push origin HEAD:feat/honest-rsi-scoreboard
