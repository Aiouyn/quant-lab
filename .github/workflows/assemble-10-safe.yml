name: assemble-10-safe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-10-safe.yml'
      - 'desk/company/_rsi_chunks/10.s12'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/honest-rsi-scoreboard
      - name: Concat safe micros into 10.part
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('desk/company/_rsi_chunks')
          parts = [(root / f'10.s{i:02d}').read_bytes() for i in range(13)]
          data = b''.join(parts)
          assert len(data) == 20005, len(data)
          assert hashlib.sha256(data).hexdigest() == 'fe2fbd02f29e8db6ef176b531d7c39ca26ee8a095b27aff5088fde765d1845bd'
          assert b'compute_generation_scoreboard' in data
          (root / '10.part').write_bytes(data)
          print('WROTE', len(data), hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/company/_rsi_chunks/10.part
          git commit -m "fix: restore 10.part from verified safe micros" || echo "no change"
          git push origin HEAD:feat/honest-rsi-scoreboard
