name: assemble-11-safe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-11-safe.yml'
      - 'desk/company/_rsi_chunks/11.s12'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/honest-rsi-scoreboard
      - name: Concat safe micros into 11.part
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('desk/company/_rsi_chunks')
          parts = [(root / f'11.s{i:02d}').read_bytes() for i in range(13)]
          data = b''.join(parts)
          assert len(data) == 20003, len(data)
          assert hashlib.sha256(data).hexdigest() == 'ef3044669400278f87132cd1334c8eb5a9115746471146508f7c5910005e8f88'
          (root / '11.part').write_bytes(data)
          print('WROTE', len(data), hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/company/_rsi_chunks/11.part
          git commit -m "fix: restore 11.part from verified safe micros" || echo "no change"
          git push origin HEAD:feat/honest-rsi-scoreboard
