name: assemble-07-micro
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-07-micro.yml'
      - 'desk/company/_rsi_chunks/07.m11'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/honest-rsi-scoreboard
      - name: Concat micro parts into 07.part
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('desk/company/_rsi_chunks')
          parts = [(root / f'07.m{i:02d}').read_bytes() for i in range(12)]
          data = b''.join(parts)
          assert len(data) == 20001, len(data)
          assert hashlib.sha256(data).hexdigest() == '9e1030b78ccdf4ec22590763281e2962f85f30c68275e19bb982500c28f31fbf'
          assert b'block-shuffled' in data
          (root / '07.part').write_bytes(data)
          print('WROTE 07.part', len(data), hashlib.sha256(data).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/company/_rsi_chunks/07.part
          git commit -m "fix: restore 07.part from verified micro parts" || echo "no change"
          git push origin HEAD:feat/honest-rsi-scoreboard
