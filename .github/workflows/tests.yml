name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: every desk module imports
        run: python -c "import pkgutil, importlib, desk; [importlib.import_module(m.name) for m in pkgutil.walk_packages(desk.__path__, 'desk.') if not m.name.startswith('desk.lib.contrib')]"
      - name: evaluator kernel matches its reviewed manifest
        run: python -m desk kernel verify
      - run: python -m pytest
